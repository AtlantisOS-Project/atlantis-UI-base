[package]
name = "atlbase"
version = "0.2.0"
edition = "2024"
# gtk4 0.11 / libadwaita 0.9 need Rust 1.92, sevenz-rust2 (feature `archive`) needs Rust 1.93
rust-version = "1.93"

description = "ATL UIBase is a modular GTK4 + Libadwaita 1.8 user interface library that simplifies the development of modern graphical applications in Rust."
readme = "README.md"

homepage = "https://github.com/AtlantisOS-Project/atlantis-UI-base"
repository = "https://github.com/AtlantisOS-Project/atlantis-UI-base"

license = "GPL-3.0"

keywords = ["gtk4", "libadwaita", "gui", "linux", "gettext"]
categories = ["gui", "os::linux-apis"]

# `include` replaces Cargo's defaults, so everything the build needs must be listed:
# the build script and the translations (po/) are required to compile the catalogs.
include = [
    "src/**",
    "build.rs",
    "po/**",
    "examples/**",
    "tests/**",
    "docs/*.md",
    "docs/index.html",
    "CHANGELOG/*.md",
    "LICENSE*",
    "README.md",
]

[features]
default = [
    "carousel-toml",
    "log-viewer",
    "format-flatpak",
    "format-snap",
    "format-appimage",
    "format-native",
]
## The package formats the library knows (`helper::platform::format`). Only the code of the formats
## that are enabled is compiled: a Snap is built with
## `default-features = false, features = ["format-snap"]` and contains nothing of Flatpak or
## AppImage. Several formats are told apart when the program starts. At least one is needed.
format-flatpak = []
format-snap = []
format-appimage = []
## No format: a deb, an RPM, `cargo install`.
format-native = []
## Load guides for the `carousel` module from TOML files (`GuideLoader`).
carousel-toml = ["dep:toml"]
## Log viewer window and header bar menu (`show_log_viewer`, `create_custom_headerbar`). Linux only.
## Pulls in VTE (`libvte-2.91-gtk4`), which is not part of the Flatpak GNOME runtime;
## turn it off with `default-features = false` if you do not need it.
log-viewer = ["dep:vte4"]
## Download a file over HTTPS (`helper::download`) with a small built-in client: no `curl` and no
## certificates of the system are needed. `sha2` checks the SHA-256 sum of `download_file_verified`.
download = ["dep:ureq", "dep:sha2"]
## Recognize and unpack archives (`helper::archive`: tar, tar.xz, tar.gz, tar.bz2, xz, gz, bz2, zip, 7z).
archive = ["dep:tar", "dep:xz2", "dep:flate2", "dep:bzip2", "dep:zip", "dep:sevenz-rust2"]
## Unfinished system configuration API (module `system`). Does not compile yet.
experimental-api = ["dep:networkmanager", "dep:tokio", "dep:thiserror"]

[dependencies]
gtk4 = { version = "0.11", features = ["v4_20"]}
# "std": set_boxed_logger; the syslog crate used to switch it on, but it is Unix only
log = { version = "0.4", features = ["std"] }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
gio = "0.22"
adw = { version = "0.9.1", package = "libadwaita", features = ["v1_8"] }
glib = "0.22"
serde = { version = "1.0", features = ["derive"] }
confy = "2.0"
directories = "6.0"
tempfile = "3.27"

# optional: only needed by the features above
toml = { version = "1", optional = true }
ureq = { version = "3", optional = true }
sha2 = { version = "0.11", optional = true }
tar = { version = "0.4.40", optional = true }
xz2 = { version = "0.1.7", optional = true }
flate2 = { version = "1.0.30", optional = true }
# "static": the C code of bzip2 is compiled in. The sonames of the system library differ between
# distributions (libbz2.so.1.0 on Debian and Ubuntu, libbz2.so.1 on Fedora), so a program built on
# one would not start on the other.
bzip2 = { version = "0.4", features = ["static"], optional = true }
zip = { version = "9", optional = true }
sevenz-rust2 = { version = "0.24", optional = true }
networkmanager = { version = "0.5", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
thiserror = { version = "2", optional = true }

# the web page of the changelog is checked against its Content-Security-Policy
[dev-dependencies]
sha2 = "0.11"

# VTE exists on Linux only
[target.'cfg(target_os = "linux")'.dependencies]
vte4 = { version = "0.10", optional = true }

# the system log of Unix; Windows logs to a file (helper::platform::logging)
[target.'cfg(unix)'.dependencies]
syslog = "7.0"

[package.metadata.docs.rs]
features = ["carousel-toml", "archive"]
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[[example]]
name = "guide"
required-features = ["carousel-toml"]

[[example]]
name = "dialogs"
required-features = ["log-viewer"]

[[example]]
name = "test_app"
required-features = ["log-viewer"]

# GTK may only be used on the main thread: this test has its own main()
[[test]]
name = "design_gtk"
harness = false

[profile.release]
opt-level = "z"     # Optimized for the smallest possible file size
lto = true          # Link Time Optimization (removes unused code across crates)
codegen-units = 1   # Prevents parallel compilation, but enables better optimization
panic = "abort"     # Removes the code for stack unwinding (saves a lot of space)
strip = true
