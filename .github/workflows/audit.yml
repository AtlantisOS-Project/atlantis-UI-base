#
# Looks for known vulnerabilities in the dependencies (cargo audit, the RustSec database): on every
# push to main, on every pull request, and once a week, because new advisories appear without a
# change of the code. The repository has no Cargo.lock (atlbase is a library), so the dependencies
# are resolved first, as an application that uses atlbase would get them.

name: audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      # pinned to a commit: a tag can be moved
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Resolve the dependencies
        run: cargo generate-lockfile
      # fails for a vulnerability; warnings (unmaintained, unsound) are only shown
      - name: Audit
        run: cargo audit
